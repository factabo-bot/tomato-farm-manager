<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>作業記録 - トマト栽培管理</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-clear-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-clear.png">
<meta name="theme-color" content="#ffffff">
<script>
// 表示（自動／ライト／ダーク）を、描画の前に当てる。後から当てると一瞬白く光るため
try { var t = localStorage.getItem("tfm_theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="stylesheet" href="styles.css?v=20261006k">
</head>
<body>
<header>
  <div class="header-sub">
    <span id="date-display"></span>
    <span id="user-info"></span>
  </div>
  <nav class="mode-nav">
    <a href="index.html"><span class="tab-icon ti-home" aria-hidden="true"></span>ホーム</a>
    <a href="work.html" class="current"><span class="tab-icon ti-work" aria-hidden="true"></span>作業</a>
    <a href="pesticide.html"><span class="tab-icon ti-spray" aria-hidden="true"></span>散布</a>
    <a href="growth.html"><span class="tab-icon ti-growth" aria-hidden="true"></span>生育</a>
    <a href="fertilizer.html"><span class="tab-icon ti-fertilizer" aria-hidden="true"></span>養液</a>
    <a href="history.html"><span class="tab-icon ti-history" aria-hidden="true"></span>履歴</a>
  </nav>
</header>

<main>
  <div id="queue-badge" class="queue-badge" hidden></div>

  <section>
    <h2>作業日</h2>
    <input type="date" id="work-date" class="date-input">
  </section>

  <section>
    <h2>① 拠点</h2>
    <div id="base-buttons" class="btn-row"><span class="hint">読み込み中…</span></div>
  </section>

  <section>
    <h2>② 棟・区画（複数選べます）</h2>
    <div id="building-buttons" class="btn-row"></div>
    <div id="building-bulk" class="btn-row"></div>
  </section>

  <section>
    <h2>③ 作業（複数選べます）</h2>
    <div id="work-buttons" class="btn-row"></div>
    <textarea id="work-detail" placeholder="作業内容を記入" hidden></textarea>

    <!-- 農薬・葉面散布肥料の散布は散布記録側だけで扱う（作業記録にも書くと1回の防除が
         2件になり、あとで作業時間を合計したときに二重に数えてしまうため）。
         ここは記録するボタンではなく、記録済みかどうかの確認と散布画面への入口 -->
    <div class="spray-link">
      <p class="hint">農薬・葉面散布肥料をまいた日は「散布」画面に記録します。押すと記録済みか確認できます</p>
      <div class="btn-row">
        <button id="check-pest" class="btn chip" type="button">防除</button>
        <button id="check-foliar" class="btn chip" type="button">葉面散布</button>
      </div>
      <div id="spray-status" hidden></div>
    </div>
  </section>

  <!-- 列マップ。farm-work-log と同じく、列（ベンチの片側）を押して選び、色で「最後にやってから何日か」を見る。
       作業を選ぶとその作業の経過日数で塗り、選んでいなければ列ごとに全作業の経過を並べる -->
  <section>
    <h2>④ 列（押して選ぶ）</h2>
    <p id="bench-caption" class="hint"></p>
    <div id="bench-area"></div>
    <div class="age-legend" aria-hidden="true">
      <span>今日</span>
      <span class="age-chip age0"></span><span class="age-chip age1"></span><span class="age-chip age2"></span><span class="age-chip age3"></span><span class="age-chip age4"></span><span class="age-chip age5"></span><span class="age-chip age6"></span><span class="age-chip age7"></span>
      <span>7日以上</span>
    </div>
  </section>

  <section class="grid-2">
    <div>
      <label>開始時刻</label>
      <input type="time" id="start-time">
    </div>
    <div>
      <label>終了時刻</label>
      <input type="time" id="end-time">
    </div>
  </section>

  <section class="grid-2">
    <div>
      <label>数量</label>
      <input type="number" id="quantity" placeholder="例: 120" inputmode="decimal">
    </div>
    <div>
      <label>単位</label>
      <input type="text" id="quantity-unit" placeholder="例: 株、kg">
    </div>
  </section>

  <section>
    <textarea id="note" placeholder="備考（任意）：気づいたこと、課題など"></textarea>
    <button id="submit" class="btn-primary" type="button">記録</button>
  </section>

  <section>
    <h2>今日の記録</h2>
    <div id="my-records"></div>
    <p class="hint">間違えたときは「取消」を2回タップで取り消せます（作業記録は当日分のみ）</p>
  </section>
</main>

<div id="toast" hidden></div>

<script src="config.js?v=20261006k"></script>
<script src="masters-default.js?v=20261006k"></script>
<script src="common.js?v=20261006k"></script>
<script src="work.js?v=20261006k"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
}
</script>
</body>
</html>
