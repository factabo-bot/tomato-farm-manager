<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>solve ui test</title>
<style>body{margin:0;font-family:monospace}#debug{font-size:12px;background:#111;color:#0f0;padding:8px;margin:0;white-space:pre-wrap}iframe{width:390px;height:600px;border:1px solid #ccc}</style>
</head><body>
<pre id="debug">testing...</pre>
<iframe id="f" src="../_work/fertilizer.html"></iframe>
<script>
const out = [];
let pass = 0, fail = 0;
function ok(l, c, x) { if (c) { pass++; out.push("  OK  " + l + (x ? " | " + x : "")); } else { fail++; out.push("  NG  " + l + (x ? " | " + x : "")); } }
function show() { document.getElementById("debug").textContent = out.join("\n"); }

const f = document.getElementById("f");
setTimeout(function () {
  const d = f.contentDocument;
  const w = f.contentWindow;
  // モード分割後は、まずモードを選ばないと全セクションが hidden になる
  d.getElementById("mode-design").click();
  // ④逆算グループは既定で畳まれている。開かないと可視判定が通らない
  if (d.getElementById("grp-reverse")) d.getElementById("grp-reverse").open = true;
  // hidden 要素は getBoundingClientRect が全ゼロを返す。
  // レイアウト検査が「中身を見ずに合格」しないよう、可視性を先に確かめる
  const visible = function (id) { const e = d.getElementById(id); return !!(e && e.offsetParent); };

  out.push("=== 逆算UI ===");

  // プリセットを選ぶ
  const sel = d.getElementById("target-preset");
  ok("プリセットの選択肢がある", sel.options.length === 4, "options=" + sel.options.length);
  sel.value = "aichi";
  sel.dispatchEvent(new Event("change"));

  setTimeout(function () {
    const st = JSON.parse(w.localStorage.getItem("tfm_fert_state") || "{}");
    ok("目標が入った(K)", Number(st.target.K) === 10.5, "K=" + st.target.K);
    ok("目標が入った(Ca)", Number(st.target.Ca) === 4.0, "Ca=" + st.target.Ca);
    ok("リン酸は3価換算値", Number(st.target.H2PO4) === 1.67, "P=" + st.target.H2PO4);

    const cat = d.getElementById("target-cation").textContent;
    const ani = d.getElementById("target-anion").textContent;
    const note = d.getElementById("target-balance-note").textContent;
    out.push("  [目標の電荷] 陽 " + cat + " / 陰 " + ani + " " + note);
    ok("愛知県処方は電荷が釣り合う", note.indexOf("釣り合") >= 0, note.trim());

    // 逆算を実行
    d.getElementById("solve").click();

    setTimeout(function () {
      const box = d.getElementById("solve-result");
      const rows = box.querySelectorAll("tbody tr");
      ok("配合が出た", rows.length >= 4, "肥料 " + rows.length + " 種");
      out.push("  [出た配合]");
      const names = [];
      rows.forEach(function (tr) {
        const td = tr.querySelectorAll("td");
        names.push(td[0].textContent);
        out.push("       " + td[0].textContent + "  " + td[1].textContent + " mmol/L  → " + td[2].textContent + " kg");
      });

      // 規制品を避けてMAPで済んでいるか
      ok("硝酸アンモニウム（規制品）を使っていない",
         names.indexOf("硝酸アンモニウム") < 0, names.join("/"));
      ok("第一リン酸アンモニウム(MAP)でNH4を入れている",
         names.some(function (n) { return n.indexOf("アンモニウム") >= 0 && n.indexOf("リン酸") >= 0; }));

      // 丸め誤差レベルの警告が出ていないか
      const warnEls = box.querySelectorAll(".fert-warn-warn");
      ok("丸め誤差での警告が出ない", warnEls.length === 0,
         warnEls.length ? warnEls[0].textContent.slice(0, 40) : "警告なし");

      // タンクに入れる
      const applyBtn = Array.prototype.slice.call(box.querySelectorAll("button"))
        .filter(function (b) { return b.textContent.indexOf("タンクに入れる") >= 0; })[0];
      ok("タンクに入れるボタンがある", !!applyBtn);
      if (applyBtn) {
        applyBtn.click();
        setTimeout(function () {
          const st2 = JSON.parse(w.localStorage.getItem("tfm_fert_state") || "{}");
          ok("タンクが2本になった", (st2.tanks || []).length === 2, "tanks=" + (st2.tanks || []).length);
          const a = st2.tanks[0], b = st2.tanks[1];
          out.push("  [A液] " + a.items.map(function (i) { return i.id + " " + i.kg; }).join(" / "));
          out.push("  [B液] " + b.items.map(function (i) { return i.id + " " + i.kg; }).join(" / "));

          // タンク名に意味は持たせない（研修先はB液がカルシウム側、CFはA液が酸性側）。
          // 見るべきは「カルシウムと硫酸/リン酸が別のタンクに分かれていること」
          const hasRole = function (t, r) {
            return t.items.some(function (i) {
              return w.FertilizerCalc.fertilizerTankRoles(i.id).indexOf(r) >= 0;
            });
          };
          const caInA = hasRole(a, "calcium"), caInB = hasRole(b, "calcium");
          ok("カルシウムはどちらか一方だけに入った", caInA !== caInB,
             "A=" + caInA + " B=" + caInB);
          const caT = caInA ? a : b;
          ok("カルシウム側に硫酸が無い", !hasRole(caT, "sulfate"));
          ok("カルシウム側にリン酸が無い", !hasRole(caT, "phosphate"));
          ok("既存のタンク配置を引き継いだ（研修先はB液がCa側）", caInB,
             "Ca側=" + (caInA ? a.name : b.name));

          // 沈殿警告が出ていないこと（分けたので出ないはず）
          const warns = d.getElementById("res-warnings").querySelectorAll(".fert-warn-danger");
          ok("沈殿警告が出ていない（正しく分かれた）", warns.length === 0, "danger=" + warns.length);

          // 逆算した組成が目標を再現しているか
          const ecTxt = d.getElementById("res-ec").textContent;
          const balTxt = d.getElementById("res-balance").textContent;
          out.push("  [再計算] EC " + ecTxt + " / 電荷誤差 " + balTxt + "%");
          ok("電荷バランスはゼロ", Math.abs(Number(balTxt)) < 0.01, balTxt);

          out.push("");
          out.push("============================");
          out.push("  PASS " + pass + " / FAIL " + fail);
          out.push("============================");
          show();
        }, 500);
      } else { show(); }
    }, 500);
  }, 500);
}, 1000);
</script>
</body></html>
