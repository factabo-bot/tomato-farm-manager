<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>散布記録 - トマト栽培管理</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2e7d32">
<link rel="stylesheet" href="styles.css?v=20260825a">
</head>
<body>
<header>
  <h1>🍅 トマト栽培管理</h1>
  <div class="header-sub">
    <span id="date-display"></span>
    <span id="user-info"></span>
  </div>
  <nav class="mode-nav">
    <a href="index.html">🏠 ホーム</a>
    <a href="work.html">📝 作業</a>
    <a href="pesticide.html" class="current">🧪 散布</a>
    <a href="growth.html">📏 生育</a>
    <a href="history.html">📋 履歴</a>
  </nav>
</header>

<main>
  <div id="queue-badge" class="queue-badge" hidden></div>

  <p class="hint law-hint">1回の散布ごとに記録します。農薬・展着剤・葉面散布肥料をまとめて混ぜた場合も、この1件に資材を並べて登録してください。正式な法定帳簿として提出する場合は内容を確認のうえ転記してください。</p>

  <section>
    <h2>使用年月日 <span class="req">★必須</span></h2>
    <input type="date" id="use-date" class="date-input">
  </section>

  <section>
    <h2>使用場所（拠点） <span class="req">★必須</span></h2>
    <div id="base-buttons" class="btn-row"><span class="hint">読み込み中…</span></div>
  </section>

  <section>
    <h2>棟・区画（複数選べます）</h2>
    <div id="building-buttons" class="btn-row"></div>
    <div id="building-bulk" class="btn-row"></div>
  </section>

  <section>
    <h2>農作物の種類 <span class="req">★必須</span></h2>
    <select id="crop-select"></select>
  </section>

  <section>
    <h2>散布の目的（複数選べます）</h2>
    <p class="hint">病害虫</p>
    <div id="purpose-pest" class="btn-row chip-row"></div>
    <p class="hint">生育・生理</p>
    <div id="purpose-growth" class="btn-row chip-row"></div>
    <input type="text" id="purpose-free" placeholder="上にないものは自由に記入（任意）">
  </section>

  <section>
    <h2>散布レシピ（選ぶと下の資材リストに自動入力されます）</h2>
    <div id="recipe-buttons" class="btn-row"></div>
  </section>

  <section>
    <h2>使用する資材（農薬・肥料など） <span class="req">★1件以上必須</span></h2>
    <input type="text" id="material-name" list="material-list" placeholder="資材名を選択または入力">
    <datalist id="material-list"></datalist>
    <p class="hint ppe-hint" id="ppe-hint" hidden></p>
    <div class="grid-2 inner">
      <input type="text" id="dilution" placeholder="希釈倍数 例: 1000倍">
      <input type="number" id="amount" placeholder="使用量" inputmode="decimal">
    </div>
    <input type="text" id="amount-unit" placeholder="使用量の単位 例: L/10a">
    <input type="number" id="total-volume" placeholder="散布液量合計(L)（任意）" inputmode="decimal">
    <button id="add-item" class="btn-secondary" type="button">＋ この資材をリストに追加</button>
    <div id="item-list"></div>
  </section>

  <section class="grid-2">
    <div>
      <label>開始時刻</label>
      <input type="time" id="start-time">
    </div>
    <div>
      <label>終了時刻</label>
      <input type="time" id="end-time">
    </div>
  </section>

  <section>
    <textarea id="note" placeholder="備考（任意）"></textarea>
    <button id="submit" class="btn-primary" type="button">記録する</button>
  </section>

  <section>
    <h2>今日の散布記録</h2>
    <div id="my-records"></div>
  </section>
</main>

<div id="toast" hidden></div>

<script src="config.js?v=20260825a"></script>
<script src="masters-default.js?v=20260825a"></script>
<script src="common.js?v=20260825a"></script>
<script src="pesticide.js?v=20260825a"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
}
</script>
</body>
</html>
