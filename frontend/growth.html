<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>生育調査 - トマト栽培管理</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2e7d32">
<link rel="stylesheet" href="styles.css?v=20260825a">
</head>
<body>
<header>
  <h1>🍅 トマト栽培管理</h1>
  <div class="header-sub">
    <span id="date-display"></span>
    <span id="user-info"></span>
  </div>
  <nav class="mode-nav">
    <a href="index.html">🏠 ホーム</a>
    <a href="work.html">📝 作業</a>
    <a href="pesticide.html">🧪 散布</a>
    <a href="growth.html" class="current">📏 生育</a>
    <a href="history.html">📋 履歴</a>
  </nav>
</header>

<main>
  <div id="queue-badge" class="queue-badge" hidden></div>

  <p class="hint law-hint">週1回、同じ株を測ると推移が読めます。茎径は<strong>生長点から15cm下</strong>で測ると値がぶれません。器具がない日は目視だけでも記録できます。</p>

  <section>
    <h2>調査日</h2>
    <input type="date" id="survey-date" class="date-input">
  </section>

  <section>
    <h2>拠点</h2>
    <div id="base-buttons" class="btn-row"><span class="hint">読み込み中…</span></div>
  </section>

  <section>
    <h2>棟・区画</h2>
    <div id="building-buttons" class="btn-row"></div>
  </section>

  <section>
    <h2>農作物の種類</h2>
    <select id="crop-select"></select>
  </section>

  <section>
    <div class="section-head">
      <h2>調査株</h2>
      <span class="hint" id="last-info"></span>
    </div>
    <div id="plant-list"></div>
    <button id="add-plant" class="btn-secondary" type="button">＋ 株を追加</button>
  </section>

  <section>
    <textarea id="note" placeholder="所感（任意）：全体の印象、気になったことなど"></textarea>
    <button id="submit" class="btn-primary" type="button">記録する</button>
  </section>

  <section>
    <h2>今日の調査</h2>
    <div id="my-records"></div>
  </section>
</main>

<div id="toast" hidden></div>

<script src="config.js?v=20260825a"></script>
<script src="masters-default.js?v=20260825a"></script>
<script src="common.js?v=20260825a"></script>
<script src="growth.js?v=20260825a"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
}
</script>
</body>
</html>
