<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>履歴 - トマト栽培管理</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2e7d32">
<link rel="stylesheet" href="styles.css?v=20260721a">
</head>
<body>
<header>
  <h1>🍅 トマト栽培管理</h1>
  <div class="header-sub">
    <span id="date-display"></span>
    <span id="user-info"></span>
  </div>
  <nav class="mode-nav">
    <a href="index.html">🏠 ホーム</a>
    <a href="work.html">📝 作業記録</a>
    <a href="pesticide.html">🧪 農薬記録</a>
    <a href="history.html" class="current">📋 履歴</a>
  </nav>
</header>

<main>
  <section>
    <div class="tab-row">
      <button id="tab-work" class="tab active" type="button">作業記録</button>
      <button id="tab-pesticide" class="tab" type="button">農薬記録</button>
    </div>
  </section>

  <section class="grid-2">
    <div>
      <label>期間（から）</label>
      <input type="date" id="from-date">
    </div>
    <div>
      <label>期間（まで）</label>
      <input type="date" id="to-date">
    </div>
  </section>

  <section>
    <label>拠点</label>
    <select id="base-filter">
      <option value="">すべて</option>
    </select>
  </section>

  <section>
    <div id="record-list"></div>
    <p class="hint" id="empty-hint" hidden>この条件の記録はありません</p>
  </section>
</main>

<div id="toast" hidden></div>

<script src="config.js?v=20260721a"></script>
<script src="masters-default.js?v=20260721a"></script>
<script src="common.js?v=20260721a"></script>
<script src="history.js?v=20260721a"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
}
</script>
</body>
</html>
